# Milewyse: entpackt beim ersten Mal milewyse-src.zip, baut die App und veröffentlicht sie auf GitHub Pages.
name: Deploy auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellcode aus ZIP übernehmen (einmalig)
        if: hashFiles('milewyse-src.zip') != ''
        run: |
          unzip -q milewyse-src.zip -d /tmp/src
          rm -rf /tmp/src/milewyse/.github
          cp -a /tmp/src/milewyse/. .
          git rm -q milewyse-src.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Quellcode aus milewyse-src.zip entpackt"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          VITE_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
